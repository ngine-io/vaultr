# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# GitHub recommends pinning actions to a commit SHA.
# To get a newer version, you will need to update the SHA.
# You can also reference a tag or branch, but the action may change without warning.
---
name: Create and publish a Container image

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ngine-io/vaultr

jobs:
  # Build once for amd64 and exercise the running image before publishing anything.
  # Packaging mistakes, such as a template missing from the wheel, only show up in an
  # installed artefact and never in the test suite.
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          push: false
          load: true
          tags: vaultr:smoke

      - name: Run the image
        run: |
          docker run -d --name vaultr -p 8000:8000 \
            -e VAULTR_PASSPHRASE_EXAMPLE=smoke-test-passphrase \
            -e VAULTR_API_TOKENS=smoke-token \
            vaultr:smoke
          for _ in $(seq 30); do
            curl -sf localhost:8000/healthz >/dev/null && break
            sleep 1
          done

      - name: Smoke test
        run: |
          set -euo pipefail
          auth="Authorization: Bearer smoke-token"

          curl -sf localhost:8000/healthz | grep -q '"status":"ok"'
          curl -sf localhost:8000/readyz  | grep -q '"status":"ready"'

          # Unauthenticated access must be refused.
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/api/v1/projects)" = 401

          # The UI renders, including the partial that lives in a subdirectory.
          curl -sf -H "$auth" localhost:8000/ | grep -q 'btn btn-primary'
          curl -sf -H "$auth" localhost:8000/static/css/main.css | grep -q '\.btn'

          # Encrypting produces a vault string and a YAML snippet.
          curl -sf -H "$auth" -H 'Content-Type: application/json' \
            -d '{"project":"example","secret":"s3cr3t","variable_name":"db_password"}' \
            localhost:8000/api/v1/encrypt | tee /tmp/out.json
          grep -q 'ANSIBLE_VAULT;1.1;AES256' /tmp/out.json
          grep -q 'db_password: !vault' /tmp/out.json

      - name: Verify the encrypted value decrypts with Ansible
        run: |
          set -euo pipefail
          pip install --quiet ansible-core
          python - <<'EOF'
          import json
          from ansible.parsing.vault import VaultLib, VaultSecret

          vault_text = json.load(open("/tmp/out.json"))["vault_text"]
          lib = VaultLib(secrets=[("default", VaultSecret(b"smoke-test-passphrase"))])
          assert lib.decrypt(vault_text.encode()).decode() == "s3cr3t"
          print("round trip ok")
          EOF

      - name: Container logs
        if: always()
        run: docker logs vaultr

  build-and-push-image:
    runs-on: ubuntu-latest
    needs: smoke-test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          push: true
          pull: true
          platforms: linux/arm64,linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
