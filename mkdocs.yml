site_name: Vaultr - Ansible Vault as a Service
site_description: Encrypt secrets into Ansible Vault strings over a web UI and an API.
site_url: https://ngine-io.github.io/vaultr/
repo_url: https://github.com/ngine-io/vaultr
edit_uri: edit/main/docs/
nav:
  - Home: index.md
  - Install: install.md
  - Configure:
      - Projects: configuration.md
      - Settings: settings.md
  - Use:
      - Web UI: web.md
      - API: api.md
      - MCP server: mcp.md
  - Security: security.md
  - Development: development.md

theme:
  name: material
  palette:
    primary: cyan
    scheme: slate
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.keys
  - tables
plugins:
  - search
