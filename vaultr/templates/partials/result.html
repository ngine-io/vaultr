{% if error %}
<div role="alert" class="alert alert-error">
  <span>{{ error }}</span>
</div>
{% endif %}

{% if vault_text %}
<div class="card bg-base-100 shadow-sm">
  <div class="card-body">
    <h2 class="card-title">
      Encrypted
      <span class="badge badge-soft badge-success">{{ selected_project }}</span>
    </h2>

    <div class="flex flex-col gap-2">
      <div class="flex items-center justify-between">
        <span class="font-semibold">Vault string</span>
        <button type="button" class="btn btn-sm btn-outline"
                data-copy-target="vault-text">Copy</button>
      </div>
      <textarea id="vault-text" readonly rows="8"
                class="textarea w-full font-mono text-xs">{{ vault_text }}</textarea>
    </div>

    {% if yaml_snippet %}
    <div class="mt-4 flex flex-col gap-2">
      <div class="flex items-center justify-between">
        <span class="font-semibold">YAML snippet</span>
        <button type="button" class="btn btn-sm btn-outline"
                data-copy-target="yaml-snippet">Copy</button>
      </div>
      <textarea id="yaml-snippet" readonly rows="10"
                class="textarea w-full font-mono text-xs">{{ yaml_snippet }}</textarea>
    </div>
    {% endif %}
  </div>
</div>
{% endif %}
